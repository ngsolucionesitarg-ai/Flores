<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17120d" />
  <meta name="description" content="Una pequeña historia hecha con flores amarillas." />
  <title>Un regalo para vos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');

    :root {
      --ink: #fff9eb;
      --muted: rgba(255, 249, 235, .64);
      --gold: #ffc92f;
      --gold-soft: #ffe08a;
      --earth: #342217;
      --stem: #637941;
      --bg: #17120d;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      overflow: hidden;
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button { font: inherit; }

    .experience {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 36%, rgba(145, 99, 40, .14), transparent 34%),
        radial-gradient(circle at 18% 12%, rgba(255, 210, 87, .045), transparent 23%),
        linear-gradient(155deg, #1d1711 0%, #130f0c 62%, #0e0c0a 100%);
    }

    .experience::before {
      content: "";
      position: absolute;
      inset: -30%;
      opacity: .34;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E");
      animation: grain .22s steps(2) infinite;
    }

    .glow {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 62vmin;
      aspect-ratio: 1;
      border-radius: 50%;
      translate: -50% -50%;
      background: rgba(238, 174, 57, .08);
      filter: blur(55px);
      transition: opacity 1.2s ease, scale 1.8s var(--ease), left 1.8s var(--ease), top 1.8s var(--ease);
    }

    .intro-copy {
      position: absolute;
      z-index: 10;
      top: max(28px, env(safe-area-inset-top));
      left: 0;
      width: 100%;
      text-align: center;
      letter-spacing: .19em;
      text-transform: uppercase;
      font-size: 10px;
      color: rgba(255,255,255,.4);
      transition: opacity .8s ease, transform .8s var(--ease);
    }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .tap-flower {
      position: absolute;
      z-index: 20;
      top: 47%;
      left: 50%;
      width: 142px;
      height: 174px;
      padding: 0;
      translate: -50% -50%;
      border: 0;
      color: var(--ink);
      background: none;
      cursor: pointer;
      transform-origin: 50% 90%;
      animation: breathe 3.4s ease-in-out infinite;
      transition: top 1.25s var(--ease), opacity .65s ease, scale .9s var(--ease);
    }

    .tap-flower:focus-visible { outline: 1px solid var(--gold-soft); outline-offset: 12px; border-radius: 50%; }
    .tap-flower__stem {
      position: absolute;
      left: calc(50% - 3px);
      top: 72px;
      width: 6px;
      height: 76px;
      border-radius: 999px;
      background: linear-gradient(90deg, #41522f, #78904e 55%, #4e6336);
      transform: rotate(-1deg);
    }

    .tap-flower__leaf {
      position: absolute;
      top: 105px;
      left: 67px;
      width: 34px;
      height: 18px;
      border-radius: 100% 0 100% 0;
      rotate: 22deg;
      background: linear-gradient(145deg, #768b4c, #41502f);
    }

    .sunflower {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 88px;
      aspect-ratio: 1;
      translate: -50% 0;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.28));
    }

    .petal {
      position: absolute;
      top: 3px;
      left: 34px;
      width: 20px;
      height: 41px;
      border-radius: 90% 15% 80% 20%;
      background: linear-gradient(110deg, #ffd84b, #eaa510 72%);
      transform-origin: 10px 41px;
      transform: rotate(calc(var(--i) * 30deg));
      box-shadow: inset 3px 2px rgba(255,255,255,.1);
    }

    .sunflower__core {
      position: absolute;
      inset: 26px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #76502a 0 4%, transparent 5%),
        radial-gradient(circle at 62% 67%, #65431f 0 4%, transparent 5%),
        radial-gradient(circle, #523116, #2b1b10 72%);
      box-shadow: 0 0 0 3px rgba(124,77,25,.42), inset 0 2px 6px rgba(0,0,0,.55);
    }

    .tap-label {
      position: absolute;
      top: calc(47% + 102px);
      left: 50%;
      z-index: 20;
      translate: -50% 0;
      margin: 0;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: .05em;
      color: var(--muted);
      animation: labelPulse 2.4s ease-in-out infinite;
      transition: opacity .55s ease, transform .6s var(--ease);
    }

    .tap-label span { color: var(--gold); font-size: 12px; }

    .earth {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 9.5%;
      width: min(290px, 76vw);
      height: 38px;
      translate: -50% 0;
      opacity: 0;
      scale: .2 1;
      transform-origin: center;
      border-radius: 50%;
      background: radial-gradient(ellipse, #4a2f1e 0%, #2b1d15 52%, transparent 73%);
      filter: blur(.15px);
      transition: opacity .8s ease, scale 1.1s var(--ease);
    }

    .earth::after {
      content: "";
      position: absolute;
      inset: 13px 16%;
      border-radius: 50%;
      box-shadow: inset 0 4px 9px rgba(0,0,0,.42);
      opacity: .6;
    }

    .plant {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: calc(9.5% + 19px);
      width: 120px;
      height: min(44vh, 360px);
      translate: -50% 0;
      pointer-events: none;
    }

    .growing-stem {
      position: absolute;
      left: calc(50% - 2px);
      bottom: 0;
      width: 4px;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3e512e, #758d4b 52%, #3b4c2c);
      transform: scaleY(0) rotate(-.8deg);
      transform-origin: bottom;
      box-shadow: 0 0 9px rgba(124,151,76,.12);
    }

    .leaf {
      position: absolute;
      left: 59px;
      bottom: var(--y);
      width: 48px;
      height: 25px;
      opacity: 0;
      transform: scale(0) rotate(var(--r));
      transform-origin: 0 100%;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(145deg, #718649, #354529);
    }

    .leaf.left {
      left: 13px;
      transform-origin: 100% 100%;
      border-radius: 0 100% 0 100%;
    }

    .heart-field {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 42%;
      width: min(83vw, 440px);
      aspect-ratio: 1 / .88;
      translate: -50% -50%;
      pointer-events: none;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,.22));
    }

    .mini-flower {
      --size: clamp(12px, 4.3vw, 21px);
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      aspect-ratio: 1;
      opacity: 0;
      scale: 0;
      rotate: var(--rot);
      border-radius: 50%;
      background:
        radial-gradient(circle, #3a2516 0 18%, #6f451e 19% 28%, transparent 29%),
        repeating-conic-gradient(from 4deg, #ffd84c 0 9deg, #e6a40f 10deg 17deg, transparent 18deg 30deg);
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.2));
      transform-origin: center;
    }

    .message {
      position: absolute;
      z-index: 30;
      left: 50%;
      bottom: max(5%, env(safe-area-inset-bottom));
      width: min(88vw, 510px);
      translate: -50% 18px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease, translate 1.5s var(--ease);
    }

    .message__eyebrow {
      margin: 0 0 7px;
      color: rgba(255,216,76,.72);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .26em;
    }

    .message h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(24px, 6.6vw, 38px);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -.025em;
    }

    .message h1 em { color: var(--gold-soft); font-weight: 500; }
    .message__note {
      max-width: 430px;
      min-height: 38px;
      margin: 10px auto 0;
      color: var(--muted);
      font-size: clamp(12px, 3.2vw, 15px);
      line-height: 1.55;
      font-weight: 300;
      white-space: pre-line;
    }

    .falling {
      position: absolute;
      z-index: 7;
      top: -30px;
      width: 9px;
      height: 18px;
      opacity: 0;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, #ffd845, #d79208);
      animation: drift var(--duration) linear forwards;
    }

    .experience.started .intro-copy,
    .experience.started .tap-label {
      opacity: 0;
      visibility: hidden;
      animation: none;
      transform: translateY(8px);
      pointer-events: none;
    }
    .experience.started .tap-flower { top: 86%; scale: .55; animation: plantDrop 1.25s var(--ease) both; }
    .experience.planted .earth { opacity: 1; scale: 1; }
    .experience.growing .tap-flower { opacity: 0; }
    .experience.growing .growing-stem { animation: growStem 1.8s var(--ease) forwards; }
    .experience.growing .leaf { animation: growLeaf .7s var(--ease) forwards; animation-delay: var(--delay); }
    .experience.blooming .glow { opacity: 1; scale: 1.35; }
    .experience.blooming .plant,
    .experience.blooming .earth { opacity: 1; transition: opacity 1.2s ease; }
    .experience.blooming .mini-flower { animation: bloom .72s var(--ease) forwards; animation-delay: var(--delay); }
    .experience.complete .heart-field { animation: heartBreath 4.8s ease-in-out infinite; }
    .experience.complete .message { opacity: 1; translate: -50% 0; pointer-events: auto; }

    @keyframes breathe { 0%,100% { transform: rotate(-1.4deg) scale(1); } 50% { transform: rotate(1.6deg) scale(1.035); } }
    @keyframes labelPulse { 0%,100% { opacity: .56; } 50% { opacity: .95; } }
    @keyframes plantDrop { 0% { transform: translateY(0) rotate(0); } 70% { transform: translateY(4px) rotate(2deg); } 100% { transform: translateY(0) rotate(0); } }
    @keyframes growStem { to { transform: scaleY(1) rotate(-.8deg); } }
    @keyframes growLeaf { to { opacity: 1; transform: scale(1) rotate(var(--r)); } }
    @keyframes bloom { 0% { opacity: 0; scale: 0; } 62% { opacity: 1; scale: 1.18; } 100% { opacity: 1; scale: 1; } }
    @keyframes heartBreath { 0%,100% { transform: scale(1); } 50% { transform: scale(1.018); } }
    @keyframes drift {
      0% { opacity: 0; transform: translate3d(0,0,0) rotate(0); }
      8% { opacity: .85; }
      100% { opacity: 0; transform: translate3d(var(--sway), 112vh, 0) rotate(var(--spin)); }
    }
    @keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(2%,-1%); } 50% { transform: translate(-1%,2%); } 75% { transform: translate(1%,1%); } }


    /* Composición final: mensaje a la izquierda y corazón protagonista a la derecha. */
    .mini-flower {
      --size: clamp(13px, 4.5vw, 22px);
      translate: -50% -50%;
    }

    .plant,
    .earth { transition: opacity 1.2s ease; }

    .experience.complete .tap-flower,
    .experience.complete .tap-label {
      display: none;
    }

    .message__note {
      margin-top: 12px;
      line-height: 1.48;
    }

    @media (min-width: 760px) {
      .heart-field {
        left: 71%;
        top: 47%;
        width: min(45vw, 480px);
      }

      .plant,
      .earth {
        left: 71%;
      }

      .experience.blooming .glow,
      .experience.complete .glow {
        left: 71%;
        top: 47%;
      }

      .message {
        left: clamp(38px, 7vw, 110px);
        bottom: auto;
        top: 50%;
        width: min(42vw, 520px);
        translate: 0 calc(-50% + 18px);
        text-align: left;
      }

      .message__note {
        max-width: 460px;
        margin-left: 0;
        margin-right: 0;
      }

      .experience.complete .message {
        translate: 0 -50%;
        pointer-events: auto;
      }
    }

    @media (max-width: 759px) {
      .heart-field {
        top: 33%;
        width: min(88vw, 410px);
      }

      .experience.blooming .glow,
      .experience.complete .glow {
        left: 50%;
        top: 33%;
      }

      .message {
        left: 7%;
        bottom: max(4%, env(safe-area-inset-bottom));
        width: 86%;
        translate: 0 18px;
        text-align: left;
      }

      .message h1 {
        font-size: clamp(23px, 7vw, 34px);
      }

      .message__note {
        max-width: 100%;
        margin-left: 0;
        margin-right: 0;
        font-size: clamp(12px, 3.5vw, 15px);
      }

      .experience.complete .message {
        translate: 0 0;
        pointer-events: auto;
      }
    }


    .sound-toggle {
      position: absolute;
      z-index: 50;
      top: max(22px, env(safe-area-inset-top));
      right: max(22px, env(safe-area-inset-right));
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      color: rgba(255,249,235,.75);
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,216,76,.18);
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: opacity .7s ease, background .3s ease, color .3s ease;
    }

    .experience.started .sound-toggle { opacity: 1; pointer-events: auto; }
    .sound-toggle:hover { background: rgba(255,216,76,.1); color: var(--gold-soft); }
    .sound-toggle.muted { color: rgba(255,249,235,.3); }
    .sound-toggle.muted::after {
      content: "";
      position: absolute;
      width: 19px;
      height: 1px;
      rotate: -42deg;
      background: currentColor;
    }

    .heart-field { transition: filter .4s ease; }
    .experience.complete .heart-field {
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }
    .heart-field.celebrate { animation: heartTap .9s var(--ease) !important; }

    .secret-line {
      max-height: 0;
      margin: 0;
      overflow: hidden;
      opacity: 0;
      color: var(--gold-soft);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(14px, 3.8vw, 19px);
      font-style: italic;
      transition: opacity .9s ease, max-height .9s var(--ease), margin .9s var(--ease);
    }
    .secret-line.visible { max-height: 48px; margin-top: 13px; opacity: 1; }

    .signature {
      margin: 13px 0 0;
      color: rgba(255,249,235,.48);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 13px;
      font-style: italic;
    }

    .replay {
      margin-top: 14px;
      padding: 7px 0;
      color: rgba(255,249,235,.44);
      background: transparent;
      border: 0;
      border-bottom: 1px solid rgba(255,216,76,.2);
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .3s ease, border-color .3s ease;
    }
    .replay:hover { color: var(--gold-soft); border-color: rgba(255,216,76,.55); }

    .falling.burst {
      top: var(--origin-y);
      left: var(--origin-x);
      opacity: 1;
      animation: burstPetal var(--duration) var(--ease) forwards;
    }

    @keyframes heartTap {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 20px 30px rgba(0,0,0,.22)); }
      42% { transform: scale(1.055); filter: drop-shadow(0 0 28px rgba(255,201,47,.3)); }
    }

    @keyframes burstPetal {
      0% { opacity: 0; transform: translate3d(0,0,0) rotate(0); }
      12% { opacity: .95; }
      100% { opacity: 0; transform: translate3d(var(--burst-x), var(--burst-y), 0) rotate(var(--spin)); }
    }

    @media (max-height: 690px) {
      .heart-field { top: 40%; width: min(69vw, 360px); }
      .message { bottom: 3%; }
      .message__note { margin-top: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="experience" id="experience" aria-live="polite">
    <div class="glow" aria-hidden="true"></div>
    <p class="intro-copy">Un regalo para vos</p>

    <section class="stage" aria-label="Una flor amarilla interactiva">
      <button class="tap-flower" id="tapFlower" type="button" aria-label="Tocá la flor para comenzar">
        <span class="tap-flower__stem"></span>
        <span class="tap-flower__leaf"></span>
        <span class="sunflower" aria-hidden="true">
          <i class="petal" style="--i:0"></i><i class="petal" style="--i:1"></i>
          <i class="petal" style="--i:2"></i><i class="petal" style="--i:3"></i>
          <i class="petal" style="--i:4"></i><i class="petal" style="--i:5"></i>
          <i class="petal" style="--i:6"></i><i class="petal" style="--i:7"></i>
          <i class="petal" style="--i:8"></i><i class="petal" style="--i:9"></i>
          <i class="petal" style="--i:10"></i><i class="petal" style="--i:11"></i>
          <i class="sunflower__core"></i>
        </span>
      </button>
      <p class="tap-label">Tocá la flor <span>♥</span></p>

      <div class="earth" aria-hidden="true"></div>
      <div class="plant" aria-hidden="true">
        <span class="growing-stem"></span>
        <i class="leaf left" style="--y:22%; --r:-22deg; --delay:.65s"></i>
        <i class="leaf" style="--y:43%; --r:19deg; --delay:1.05s"></i>
        <i class="leaf left" style="--y:63%; --r:-15deg; --delay:1.35s"></i>
      </div>
      <div class="heart-field" id="heartField" role="button" tabindex="0" aria-label="Tocá el corazón para descubrir un mensaje"></div>
    </section>

    <section class="message" id="message">
      <p class="message__eyebrow">21 de septiembre · Flores Amarillas</p>
      <h1>Hoy quizás no llegué con<br><em>flores amarillas...</em></h1>
      <p class="message__note" id="typedNote"></p>
      <p class="secret-line" id="secretLine">Y volvería a elegirte siempre.</p>
      <p class="signature">Con amor, Nico</p>
      <button class="replay" id="replay" type="button">Volver a verlo</button>
    </section>

    <audio id="backgroundMusic" preload="auto" loop playsinline><source src="./assets/flores-amarillas-instrumental.mp3?v=20260921-2" type="audio/mpeg"></audio>
    <button class="sound-toggle" id="soundToggle" type="button" aria-label="Silenciar música" title="Silenciar música">♪</button>
  </main>

  <script>
    const experience = document.querySelector('#experience');
    const trigger = document.querySelector('#tapFlower');
    const heartField = document.querySelector('#heartField');
    const typedNote = document.querySelector('#typedNote');
    const secretLine = document.querySelector('#secretLine');
    const replay = document.querySelector('#replay');
    const soundToggle = document.querySelector('#soundToggle');
    const backgroundMusic = document.querySelector('#backgroundMusic');
    const note = `pero no quería que este día pasara sin regalarte algo.
Así que decidí plantar algunas para vos...
aunque estas duren un poquito más. 💛
Feliz día de las flores amarillas, mi amor.
Te amo ❤️`;
    let started = false;
    let petalTimer;
    let musicOn = false;

    // Rellena la ecuación de un corazón con una distribución orgánica y estable.
    function insideHeart(x, y) {
      const a = x * 1.18;
      const b = -y * 1.2;
      return Math.pow(a * a + b * b - 1, 3) - a * a * Math.pow(b, 3) <= 0;
    }

    function seededRandom(seed) {
      const value = Math.sin(seed * 999.91) * 43758.5453;
      return value - Math.floor(value);
    }

    function buildHeart() {
      const points = [];
      const candidates = [];
      for (let y = -1.05; y <= 1.05; y += .072) {
        for (let x = -1.1; x <= 1.1; x += .072) {
          if (!insideHeart(x, y)) continue;
          const seed = candidates.length + 3;
          candidates.push({
            x: x + (seededRandom(seed) - .5) * .055,
            y: y + (seededRandom(seed + 41) - .5) * .055,
            rank: y + seededRandom(seed + 99) * .34
          });
        }
      }

      // El espaciado evita una masa uniforme: se distinguen flores individuales.
      candidates.sort((a, b) => a.rank - b.rank);
      candidates.forEach(point => {
        if (points.every(p => Math.hypot(p.x - point.x, p.y - point.y) > .112)) points.push(point);
      });

      points.sort((a, b) => b.y - a.y).forEach((point, index) => {
        const flower = document.createElement('i');
        flower.className = 'mini-flower';
        flower.style.setProperty('--x', `${(point.x + 1.16) / 2.32 * 100}%`);
        flower.style.setProperty('--y', `${(point.y + 1.12) / 2.24 * 100}%`);
        flower.style.setProperty('--rot', `${Math.round(seededRandom(index + 8) * 36 - 18)}deg`);
        flower.style.setProperty('--delay', `${(index * .042 + seededRandom(index) * .16).toFixed(2)}s`);
        heartField.appendChild(flower);
      });
    }

    function typeMessage() {
      let index = 0;
      const characters = Array.from(note);
      const tick = () => {
        typedNote.textContent = characters.slice(0, index++).join('');
        if (index <= characters.length) window.setTimeout(tick, 28);
      };
      tick();
    }

    function releasePetal() {
      if (!experience.classList.contains('complete')) return;
      const petal = document.createElement('i');
      petal.className = 'falling';
      petal.style.left = `${23 + Math.random() * 54}%`;
      petal.style.setProperty('--duration', `${5 + Math.random() * 2.8}s`);
      petal.style.setProperty('--sway', `${-70 + Math.random() * 140}px`);
      petal.style.setProperty('--spin', `${180 + Math.random() * 420}deg`);
      experience.appendChild(petal);
      petal.addEventListener('animationend', () => petal.remove());
    }


    function setSoundState(isPlaying) {
      musicOn = isPlaying;
      soundToggle.classList.toggle('muted', !isPlaying);
      const label = isPlaying ? 'Silenciar música' : 'Activar música';
      soundToggle.setAttribute('aria-label', label);
      soundToggle.title = label;
      soundToggle.textContent = isPlaying ? '♪' : '♫';
    }

    async function startMusic({ restart = false } = {}) {
      try {
        backgroundMusic.muted = false;
        backgroundMusic.volume = .62;
        if (restart || backgroundMusic.ended) backgroundMusic.currentTime = 0;

        // play() se ejecuta directamente desde el gesto del usuario.
        const playPromise = backgroundMusic.play();
        if (playPromise) await playPromise;

        setSoundState(!backgroundMusic.paused);
      } catch (error) {
        console.warn('No se pudo reproducir la música:', error);
        setSoundState(false);
      }
    }

    function toggleMusic(event) {
      event?.stopPropagation();
      if (backgroundMusic.paused) {
        startMusic({ restart: true });
      } else {
        backgroundMusic.pause();
        setSoundState(false);
      }
    }

    function burstFromHeart() {
      if (!experience.classList.contains('complete')) return;
      heartField.classList.remove('celebrate');
      void heartField.offsetWidth;
      heartField.classList.add('celebrate');
      secretLine.classList.add('visible');
      const rect = heartField.getBoundingClientRect();
      for (let i = 0; i < 18; i++) {
        const petal = document.createElement('i');
        petal.className = 'falling burst';
        petal.style.setProperty('--origin-x', `${rect.left + rect.width * (.24 + Math.random() * .52)}px`);
        petal.style.setProperty('--origin-y', `${rect.top + rect.height * (.28 + Math.random() * .5)}px`);
        petal.style.setProperty('--burst-x', `${-105 + Math.random() * 210}px`);
        petal.style.setProperty('--burst-y', `${90 + Math.random() * 190}px`);
        petal.style.setProperty('--spin', `${220 + Math.random() * 520}deg`);
        petal.style.setProperty('--duration', `${2.2 + Math.random() * 1.3}s`);
        experience.appendChild(petal);
        petal.addEventListener('animationend', () => petal.remove());
      }
      window.setTimeout(() => heartField.classList.remove('celebrate'), 950);
    }

    function begin() {
      if (started) return;
      started = true;
      trigger.disabled = true;
      experience.classList.add('started');
      startMusic();

      window.setTimeout(() => experience.classList.add('planted'), 760);
      window.setTimeout(() => experience.classList.add('growing'), 1480);
      window.setTimeout(() => experience.classList.add('blooming'), 3150);
      window.setTimeout(() => {
        experience.classList.add('complete');
        typeMessage();
        releasePetal();
        petalTimer = window.setInterval(releasePetal, 1250);
      }, 7350);
    }

    backgroundMusic.volume = .62;
    backgroundMusic.muted = false;
    backgroundMusic.load();
    setSoundState(false);

    backgroundMusic.addEventListener('play', () => setSoundState(true));
    backgroundMusic.addEventListener('pause', () => {
      if (!backgroundMusic.ended) setSoundState(false);
    });
    backgroundMusic.addEventListener('error', () => {
      console.warn('Error cargando el archivo de audio.', backgroundMusic.error);
      setSoundState(false);
    });

    buildHeart();
    trigger.addEventListener('click', begin);
    soundToggle.addEventListener('click', toggleMusic);
    heartField.addEventListener('click', burstFromHeart);
    heartField.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') burstFromHeart();
    });
    function resetExperience() {
      if (petalTimer) {
        window.clearInterval(petalTimer);
        petalTimer = null;
      }

      document.querySelectorAll('.falling').forEach(petal => petal.remove());
      experience.classList.remove('started', 'planted', 'growing', 'blooming', 'complete');
      heartField.classList.remove('celebrate');
      secretLine.classList.remove('visible');
      typedNote.textContent = '';

      backgroundMusic.pause();
      backgroundMusic.currentTime = 0;
      backgroundMusic.muted = false;
      setSoundState(false);

      started = false;
      trigger.disabled = false;
      window.setTimeout(() => trigger.focus({ preventScroll: true }), 50);
    }

    replay.addEventListener('click', event => {
      event.stopPropagation();
      resetExperience();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && petalTimer) window.clearInterval(petalTimer);
      if (!document.hidden && experience.classList.contains('complete')) petalTimer = window.setInterval(releasePetal, 1250);
    });
  </script>
</body>
</html>
